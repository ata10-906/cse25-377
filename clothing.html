		 <style>
      :root {
        --green-dark: #3d5a45;
        --green-nav: #4a6741;
        --orange: #e87722;
        --orange-dark: #c96010;
        --white: #ffffff;
        --card-bg: #3d5a45;
        --footer-bg: #0d0d0d;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Open Sans', sans-serif; background: #b0b8b0; }

      /* ===== NAVBAR ===== */
      .navbar {
        background-color: var(--green-nav) !important;
        padding: 0;
        min-height: 90px;
      }
      .navbar-brand img {
        width: 90px; height: 90px;
        object-fit: contain; background: #fff;
      }
      .navbar .nav-link {
        color: var(--white) !important;
        font-family: 'Oswald', sans-serif;
        font-size: 1rem; font-weight: 600;
        letter-spacing: 1px;
        padding: 0.5rem 1rem !important;
        text-transform: uppercase;
      }
      .navbar .nav-link:hover { color: var(--orange) !important; }
      .navbar .dropdown-menu { background-color: var(--green-dark); border: none; border-radius: 0; }
      .navbar .dropdown-item { color: var(--white); font-family: 'Oswald', sans-serif; letter-spacing: 1px; }
      .navbar .dropdown-item:hover { background-color: var(--orange); color: var(--white); }
      .search-input {
        border-radius: 20px 0 0 20px; border: none;
        padding: 6px 14px; font-size: 0.9rem; outline: none; width: 150px;
      }
      .search-btn {
        background: var(--white); border: none;
        border-radius: 0 20px 20px 0; padding: 6px 10px; cursor: pointer; color: #555;
      }
      .cart-icon { color: var(--orange); font-size: 1.6rem; cursor: pointer; margin-left: 10px; }

      /* ===== MAIN LAYOUT ===== */
      .clothing-main {
        display: flex;
        gap: 0;
        background: var(--card-bg);
        min-height: 400px;
      }

      /* LEFT SIDEBAR */
      .clothing-sidebar {
        width: 220px;
        min-width: 180px;
        display: flex;
        flex-direction: column;
        gap: 0;
        flex-shrink: 0;
        background: var(--card-bg);
        padding: 12px;
        gap: 10px;
      }
      .sidebar-img-box, .sidebar-video-box {
        width: 100%;
        height: 155px;
        background: #222;
        overflow: hidden;
        position: relative;
        border-radius: 4px;
      }
      .sidebar-img-box img,
      .sidebar-video-box video {
        width: 100%; height: 100%; object-fit: cover;
      }
      .play-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      .play-circle {
        width: 40px; height: 40px;
        border-radius: 50%;
        background: rgba(255,255,255,0.82);
        display: flex; align-items: center; justify-content: center;
        font-size: 0.95rem; color: #333;
      }

      /* RIGHT PRODUCTS */
      .clothing-content {
        flex: 1;
        padding: 16px;
        overflow: hidden;
      }

      /* Section tabs */
      .section-tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .tab-btn {
        background: transparent;
        border: 2px solid var(--white);
        color: var(--white);
        font-family: 'Oswald', sans-serif;
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 2px;
        padding: 6px 20px;
        border-radius: 2px;
        cursor: pointer;
        text-transform: uppercase;
        transition: background 0.2s, color 0.2s;
        text-decoration: none;
      }
      .tab-btn:hover, .tab-btn.active {
        background: var(--orange);
        border-color: var(--orange);
        color: #fff;
      }

      /* Product section */
      .clothing-section {
        display: none;
      }
      .clothing-section.active {
        display: block;
      }
      .section-heading {
        font-family: 'Oswald', sans-serif;
        color: var(--white);
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 12px;
        border-left: 4px solid var(--orange);
        padding-left: 10px;
      }

      /* Product rows */
      .product-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .product-card {
        background: var(--orange);
        border-radius: 6px;
        padding: 10px;
        width: 140px;
        min-width: 120px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.15s;
        border: 2px solid transparent;
      }
      .product-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 18px rgba(0,0,0,0.3);
        border-color: var(--white);
      }
      .product-card img {
        width: 80px; height: 70px;
        object-fit: contain;
        background: #fff;
        border-radius: 4px;
        padding: 4px;
      }
      .product-card .p-name {
        font-family: 'Oswald', sans-serif;
        color: var(--white);
        font-size: 0.85rem;
        font-weight: 600;
        text-align: center;
      }
      .product-card .p-price {
        color: var(--white);
        font-size: 0.8rem;
        font-weight: 700;
      }
      .product-card .btn-buy {
        background: #000;
        color: var(--orange);
        border: none;
        border-radius: 12px;
        padding: 4px 12px;
        font-family: 'Oswald', sans-serif;
        font-size: 0.75rem;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        margin-top: 3px;
        display: inline-block;
        transition: background 0.2s;
      }
      .product-card .btn-buy:hover { background: #222; }

      /* ===== FOOTER ===== */
      footer { background: var(--footer-bg); color: var(--white); padding: 24px 0; }
      .footer-inner {
        display: flex; flex-wrap: wrap; gap: 20px;
        justify-content: space-between; align-items: flex-start;
        max-width: 960px; margin: 0 auto; padding: 0 20px;
      }
      .footer-col { min-width: 150px; }
      .footer-copy { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
      .contact-title, .social-title, .help-title {
        color: var(--orange); font-family: 'Oswald', sans-serif;
        font-size: 1rem; font-weight: 600; letter-spacing: 1px; margin-bottom: 8px;
      }
      .contact-row { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; margin-bottom: 4px; }
      .contact-row i { color: var(--orange); width: 18px; }
      .social-icons { display: flex; gap: 10px; }
      .social-icon {
        width: 40px; height: 40px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 1.1rem; color: #fff; text-decoration: none; transition: opacity 0.2s;
      }
      .social-icon:hover { opacity: 0.8; }
      .social-icon.ig { background: linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); }
      .social-icon.fb { background: #1877f2; }
      .social-icon.tw { background: #1da1f2; }
      .footer-help a { color: var(--white); display: block; font-size: 0.88rem; text-decoration: none; margin-bottom: 4px; }
      .footer-help a:hover { color: var(--orange); }

      @media (max-width: 768px) {
        .clothing-main { flex-direction: column; }
        .clothing-sidebar { width: 100%; flex-direction: row; }
        .sidebar-img-box, .sidebar-video-box { flex: 1; }
      }

		<script>
			 function showSection(sectionId) {
		        document.querySelectorAll('.equip-section').forEach(s => s.classList.remove('active'));
		        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
		        const section = document.getElementById(sectionId);
		        if (section) section.classList.add('active');
		        document.querySelectorAll('.tab-btn').forEach(b => {
		          if (b.textContent.trim().toLowerCase().includes(sectionId)) {
		            b.classList.add('active');
		          }
		        });
		        if (section) section.scrollIntoView({ behavior: 'smooth', block: 'start' });
		      }
	
		      window.addEventListener('DOMContentLoaded', () => {
		        const hash = window.location.hash.replace('#','');
		        if (hash && ['football','basketball','tennis'].includes(hash)) {
		          showSection(hash);
		        }
		      });
		</script>
