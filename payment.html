<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Payment - ProSport Gear</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--BOOTSTRAP-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
    <!--FONT AWESOME-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!--JAVASCRIPT-->
    <script src="javascript.js"></script>

    <style>
      :root{
        --green-nav: #4a6741;
        --green-dark: #3d5a45;
        --orange: #e87722;
        --white: #ffffff;
        --golden-orange: #f09433;
        --crimson-red: #dc2743;
        --deep-pink: #bc1888;
        --orange-red: #e6683c;
        --raspberry-pink: #cc2366;
        --facebook-blue: #1877f2;
        --sky-blue: #1da1f2;
        --: #c96010;
        --very dark-grey: #222;
        --medium dark-grey: #555;
        --black: #000;
        --Light-greyish-green: #b0b8b0;
        --very dark-grey: #222;
        --footer-bg: #0d0d0d;
      }
      
      /* --- NAVBAR SECTION --- */
      * { 
        box-sizing: border-box;
        margin: 0; 
        padding: 0; 
      }
      body { 
        font-family: sans-serif; 
        background: #b0b8b0;
      }

      /* NAVBAR */
      .navbar { 
        background-color: #4a6741; 
        padding: 0; 
        min-height: 90px;
      }
      .navbar-brand img { 
        width: 90px; 
        height: 90px; 
        object-fit: contain;
        background: #fff; 
      }
      .navbar .nav-link {
        color: #ffffff; 
        font-family: sans-serif;
        font-size: 1rem; 
        font-weight: 600;
        letter-spacing: 1px;
        padding: 0.5rem 1rem !important; 
        text-transform: uppercase;
      }
      .navbar .nav-link:hover { color: #e87722;}
      .navbar .dropdown-menu { 
        background-color: #3d5a45;
        border: none; 
        border-radius: 0;
      }
      .navbar .dropdown-item { 
        color: #ffffff;
        font-family: sans-serif; 
        letter-spacing: 1px; 
      }
      .navbar .dropdown-item:hover { 
        background-color: #e87722; 
        color: #ffffff; 
      }
      .search-input {
        border-radius: 20px 0 0 20px; 
        border: none;
        padding: 6px 12px; 
        font-size: 0.88rem;
        outline: none; 
        width: 130px;
      }
      .search-btn {
        background: #ffffff;
        border: none;
        border-radius: 0 20px 20px 0;
        padding: 6px 10px; 
        cursor: pointer; 
        color: #555;
      }
      .cart-icon { 
        color: #e87722;
        font-size: 1.5rem;
        cursor: pointer; 
        margin-left: 8px; 
      }

      /* --- PAGE TITLE ---*/
      .payment-title{
        text-align: center;
        color: #fff;
        background: #3d5a45;
        padding: 20px;
        letter-spacing: 2px;
      }
      
      /* --- PAYMENT SECTION --- */
      .payment-container{
        width: 90%;
        max-width: 900px;
        margin: 30px auto;
        background: #3d5a45;
        padding: 30px;
        border-radius: 10px;
      }
      
      /* PAYMENT OPTIONS */
      .payment-options{
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
        margin-bottom: 30px;
      }
      
      /* PAYMENT CARD */
      .payment-card{
        background: #e87722;
        width: 180px;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        cursor: pointer;
        transition: 0.2s;
      }
      
      .payment-card:hover{
        transform: translateY(-5px);
      }
      
      /* PAYMENT ICONS */
      .payment-card i{
        font-size: 3rem;
        color: #fff;
        margin-bottom: 10px;
      }
      
      /* PAYMENT TEXT */
      .payment-card h3{
        color: #fff;
        font-size: 1rem;
      }
      
      /* FORM */
      .payment-form{
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      
      /* INPUTS */
      .payment-form input{
        padding: 12px;
        border: none;
        border-radius: 20px;
        outline: none;
      }
      
      /* BUTTON */
      .pay-buy {
        background: #e87722; 
        color: #fff;
        border: none;
        border-radius: 20px;
        padding: 6px 16px;
        font-family: sans-serif;
        font-size: 0.83rem; 
        font-weight: 700;
        letter-spacing: 1px; 
        cursor: pointer; 
        text-decoration: none;
        transition: background 0.2s;
      }
      .pay-buy:hover {
        background: #c96010; 
        color: #fff; 
      }
      /* MESSAGE */
      #paymentMessage{
        text-align: center;
        color: #fff;
        margin-top: 20px;
        font-size: 1rem;
        font-weight: bold;
      }
      
      /* --- FOOTER SECTION--- */
        /* FOOTER */
      footer { 
        background: #0d0d0d;
        color: #ffffff; 
        padding: 24px 0;
      }
      .footer-inner {
        display: flex;
        flex-wrap: wrap; 
        gap: 20px;
        justify-content: space-between;
        align-items: flex-start;
        max-width: 960px; 
        margin: 0 auto;
        padding: 0 20px;
      }
      .footer-col { min-width: 140px; }
      .footer-copy { 
        display: flex;
        align-items: center;
        gap: 8px; 
        font-size: 0.9rem; 
      }
      .contact-title, .social-title, .help-title {
        color: #e87722;
        font-family: sans-serif;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 1px;
        margin-bottom: 8px;
      }
      .contact-row { 
        display: flex;
        align-items: center; 
        gap: 8px; 
        font-size: 0.88rem;
        margin-bottom: 4px; 
      }
      .contact-row i { 
        color: #e87722;
        width: 18px;
      }
      .social-icons {
        display: flex;
        gap: 10px;
      }
      .social-icon {
        width: 38px; 
        height: 38px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        color: #fff; 
        text-decoration: none;
        transition: opacity 0.2s;
      }
      .social-icon:hover { opacity: 0.8; }
      .social-icon.ig { 
        background: linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); 
      }
      .social-icon.fb { background: #1877f2; }
      .social-icon.tw { background: #1da1f2; }
      .footer-help a { 
        color: #ffffff;
        display: block; 
        font-size: 0.88rem;
        text-decoration: none; 
        margin-bottom: 4px;
      }
      .footer-help a:hover { color: #e87722; }

      @media (max-width: 700px) {
        .products-ads-section { flex-direction: column; }
        .ads-left { width: 100%; }
      }
      
    </style>


    
  </head>
  
</html>
